; =============================================================================
; Bamero PHP Upload Configuration
; =============================================================================

; Maximum file upload size
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M

; Memory settings
memory_limit = 256M

; Execution time
max_execution_time = 300
max_input_time = 300

; Session settings
session.save_path = "/var/www/html/wp-content/sessions"
session.gc_maxlifetime = 1440

; Error reporting (development)
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /var/www/html/wp-content/debug.log

; Timezone
date.timezone = Asia/Tehran

; =============================================================================
