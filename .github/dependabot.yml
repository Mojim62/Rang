version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # پروژه وابستگی composer قفل‌شده ندارد؛ برای پایش آیندهٔ ابزارهای PHP فعال می‌ماند.
    open-pull-requests-limit: 3
