name: Compress product images
on:
  push:
    paths:
      - "wp-content/plugins/bamero-woocommerce-setup/assets/products/**/*.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install pngquant
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pngquant

      - name: Compress PNGs (lossy, quality 80-95)
        run: |
          find wp-content/plugins/bamero-woocommerce-setup/assets/products -name '*.png' -print0 |
            xargs -0 -r -n1 sh -c 'pngquant --skip-if-larger --force --quality=80-95 --output "$1" "$1"' sh

      - name: Commit compressed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wp-content/plugins/bamero-woocommerce-setup/assets/products
          if git diff --cached --quiet; then
            echo "هیچ تصویری نیاز به فشرده‌سازی نداشت."
            exit 0
          fi
          git commit -m "chore(images): فشرده‌سازی خودکار تصاویر محصول با pngquant"
          git push
