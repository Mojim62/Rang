name: Bamero production gate
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  static-production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, openssl
          tools: none
      - name: PHP lint
        run: find . -type f -name '*.php' -not -path './docs/*' -print0 | xargs -0 -n1 php -l
      - name: Shell syntax check (all shell scripts)
        run: find scripts tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck on the release pipeline (errors only)
        run: shellcheck --severity=error scripts/build-release.sh scripts/deploy-release.sh scripts/verify-deployment.sh scripts/rollback-release.sh
      - name: Workflow YAML sanity
        run: |
          ruby -ryaml -e 'Dir[".github/workflows/*.yml"].sort.each { |f| YAML.safe_load(File.read(f)); puts "YAML OK: " + f }'
      - name: Production gate
        run: bash tests/production_gate.sh
      - name: Go-live certification (static)
        run: |
          mkdir -p artifact
          set -o pipefail
          bash tests/go_live_certification.sh | tee artifact/go-live-certification.txt
      - name: Immutable artifact manifest
        run: |
          mkdir -p artifact
          find . -type f -not -path './.git/*' -not -path './artifact/*' -print0 | sort -z | xargs -0 sha256sum > artifact/sha256-manifest.txt
          tar --exclude=.git --exclude=artifact -czf artifact/bamero-source.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: bamero-source-${{ github.sha }}
          path: artifact/
          retention-days: 14