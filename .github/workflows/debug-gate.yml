name: Debug gate (temporary - remove after diagnosis)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  debug-gate:
    if: github.head_ref == 'fix/sre-detector-deploy-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, curl, openssl
          tools: none

      - name: Run gate with xtrace and capture full log
        run: |
          set +e
          bash -x tests/production_gate.sh >/tmp/gate.log 2>&1
          echo "GATE_EXIT=$?" >> /tmp/gate.log
          bash -x tests/regression/test_duplicate_detector.sh >>/tmp/gate.log 2>&1
          echo "REGRESSION_EXIT=$?" >> /tmp/gate.log
          php -l tests/check_duplicate_functions.php >>/tmp/gate.log 2>&1
          echo "LINT_DETECTOR_EXIT=$?" >> /tmp/gate.log
          php tests/check_duplicate_functions.php "$PWD" >>/tmp/gate.log 2>&1
          echo "DETECTOR_REPOSCAN_EXIT=$?" >> /tmp/gate.log

      - name: Post captured log as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/gate.log', 'utf8'); } catch (e) { log = 'log read failed: ' + e; }
            if (log.length > 60000) log = log.slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '## gate xtrace log\n```\n' + log + '\n```'
            });
