name: Build release package

on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full, for git describe)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # یک builder canonical: همان اسکریپتی که local developer اجرا می‌کند
      - name: Build bamero-release.zip
        run: bash scripts/build-release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: bamero-release
          path: dist/bamero-release.zip
          retention-days: 30
          if-no-files-found: error
