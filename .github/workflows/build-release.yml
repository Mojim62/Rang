name: Build deploy package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble clean deploy bundle
        run: |
          mkdir -p dist/stage
          cp wp-config.php dist/stage/
          cp -R wp-content dist/stage/wp-content
          find dist/stage -type d \( -name '.git' -o -name 'node_modules' \) -prune -exec rm -rf {} + 2>/dev/null || true
          find dist/stage -type f -name '.DS_Store' -delete 2>/dev/null || true
          cd dist/stage
          zip -r -q ../bamero-deploy.zip wp-config.php wp-content

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: bamero-deploy
          path: dist/bamero-deploy.zip
          retention-days: 30
